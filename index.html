<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Wasim & Rinsa — Wedding Invitation</title>
    <meta name="description" content="Wedding & Nikkah of Wasim Mohamed & Rinsa T.C. on Sunday, 27th December 2026 at Conventional Hall, The Raviz Kadavu, Calicut." />
    <link rel="icon" type="image/x-icon" href="./favicon.ico" />
    <script src="./editable/wedding-data.js"></script>
    <script type="module" crossorigin src="./assets/index-2d1L6cXj.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/styles-DJO19CfA.css">
    <style>
      /* Music Controller Floating Button */
      .bg-music-toggle {
        position: fixed;
        top: max(16px, env(safe-area-inset-top));
        right: max(16px, env(safe-area-inset-right));
        z-index: 50;
        width: 40px;
        height: 40px;
        border-radius: 50%;
        background: rgba(251, 248, 242, 0.9);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border: 1px solid rgba(180, 140, 75, 0.45);
        color: #3c2d19;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        box-shadow: 0 4px 16px rgba(60, 45, 25, 0.15);
        transition: transform 0.25s ease, background 0.25s ease, opacity 0.4s ease;
        opacity: 0;
        pointer-events: none;
      }
      .bg-music-toggle.visible {
        opacity: 1;
        pointer-events: auto;
      }
      .bg-music-toggle:hover {
        transform: scale(1.08);
        border-color: rgba(180, 140, 75, 0.8);
        background: rgba(255, 253, 249, 0.98);
      }
      .bg-music-toggle:active {
        transform: scale(0.95);
      }
      .bg-music-toggle.is-playing svg {
        animation: music-spin 5s linear infinite;
      }
      @keyframes music-spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <!-- Background Music Audio & Toggle -->
    <audio id="bg-audio" loop preload="auto">
      <source src="./editable/assets/bg-music.mp3" type="audio/mpeg">
    </audio>
    <button id="music-toggle" class="bg-music-toggle" aria-label="Toggle background music">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 18V5l12-2v13"></path>
        <circle cx="6" cy="18" r="3"></circle>
        <circle cx="18" cy="16" r="3"></circle>
      </svg>
    </button>

    <script>
      (function() {
        const audio = document.getElementById('bg-audio');
        const toggleBtn = document.getElementById('music-toggle');
        let isStarted = false;
        let initialSeekDone = false;

        const targetStartTime = (window.WEDDING_DATA && window.WEDDING_DATA.music && typeof window.WEDDING_DATA.music.startTime === 'number')
          ? window.WEDDING_DATA.music.startTime
          : 8.0;

        function startMusic() {
          if (isStarted) return;
          isStarted = true;

          try {
            audio.currentTime = targetStartTime;
            initialSeekDone = true;
          } catch(e) {}

          audio.play().then(() => {
            if (!initialSeekDone || Math.abs(audio.currentTime - targetStartTime) > 2.0) {
              audio.currentTime = targetStartTime;
              initialSeekDone = true;
            }
            toggleBtn.classList.add('visible', 'is-playing');
          }).catch(err => {
            // Autoplay restricted by browser until direct interaction
            isStarted = false;
          });
        }

        // Trigger on first click / tap (such as wax seal opener or scroll)
        ['click', 'pointerdown', 'touchstart'].forEach(evt => {
          document.addEventListener(evt, startMusic, { passive: true });
        });

        // Toggle button play/pause
        toggleBtn.addEventListener('click', function(e) {
          e.stopPropagation();
          if (audio.paused) {
            audio.play().then(() => {
              toggleBtn.classList.add('is-playing');
            });
          } else {
            audio.pause();
            toggleBtn.classList.remove('is-playing');
          }
        });
      })();
    </script>
  </body>
</html>
